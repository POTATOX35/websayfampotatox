<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <title>Post Detay</title>
    <link rel="stylesheet" href="	https://potatoxyazilar.glitch.me/style.css">
</head>
<body>
    <header>
        <div class="sabit-bar">
            <h1 id="postTitle">Başlık</h1>
        </div>
    </header>
    <main>
        <div id="postlist">
            <div class="post-content">
                <p id="postContent"></p>
            </div>
        </div>
  </main>

  

    
  <script>
    window.onload = function() {
    // URL'den ID'yi almak için location.pathname kullanabiliriz
    const path = window.location.pathname; 
    const id = path.split('/').pop();  // /postdetay/id şeklinde URL, son kısımdan id'yi alıyoruz
    
    // Sonrasında ID'yi kullanarak serverdan veri çekebiliriz
    fetch(`/getPost/${id}`)
        .then(response => response.json())
        .then(data => {
            let cleanContent = data.content.replace(/\n/g, '<br>').replace(/'/g, '"');
            document.getElementById('postTitle').textContent = data.title;
            document.getElementById('postContent').innerHTML = cleanContent;
            document.title = data.title;

        })
        .catch(error => console.error('Error:', error));
}
   function adjustMainMargin() {
    const headerHeight = document.querySelector('.sabit-bar').offsetHeight;
    const mainElement = document.querySelector('main');
    console.log("Header Height:", headerHeight);  // Konsola header yüksekliğini yazdırıyoruz
    console.log("Main Element:", mainElement);  // Konsola main elementini yazdırıyoruz
    mainElement.style.marginTop = `${headerHeight}px`;
}

// Sayfa yüklenince başlat
window.addEventListener('load', adjustMainMargin);

// Pencere yeniden boyutlandığında güncelle
window.addEventListener('resize', adjustMainMargin);

</script>




</body>
</html>
